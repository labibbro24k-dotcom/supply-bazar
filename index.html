<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সাপ্লাই বাজার</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{ --orange:#ff5722; --orange-dark:#e64a19; --bg:#fff3ea; }
  *{box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif;}
  body{margin:0; background:linear-gradient(180deg,var(--orange),#ffb59b 30%, #fff 30%); min-height:100vh;}
  .container{max-width:480px; margin:0 auto; padding:16px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; color:#fff; padding:14px 4px;}
  .topbar h1{font-size:20px; margin:0; cursor:pointer; user-select:none;}
  .card{background:#fff; border-radius:18px; padding:22px 18px; box-shadow:0 8px 24px rgba(0,0,0,.15);}
  .tabs{display:flex; background:#f1f1f1; border-radius:12px; padding:4px; margin-bottom:18px;}
  .tab{flex:1; text-align:center; padding:10px; border-radius:10px; cursor:pointer; font-weight:600; color:#555;}
  .tab.active{background:var(--orange); color:#fff;}
  label{display:block; font-size:13px; color:#666; margin:12px 0 4px;}
  input, select, textarea{width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:15px; background:#fafafa;}
  button.primary{width:100%; background:var(--orange); color:#fff; border:none; padding:14px; border-radius:12px; font-size:16px; font-weight:700; margin-top:18px; cursor:pointer;}
  button.primary:active{background:var(--orange-dark);}
  button.secondary{width:100%; background:#eee; color:#333; border:none; padding:10px; border-radius:10px; margin-top:8px; cursor:pointer;}
  a.link{display:block; text-align:center; color:var(--orange); margin-top:14px; text-decoration:none; font-size:14px;}
  .hint{background:#fff3e0; border-radius:10px; padding:12px; margin-top:16px; font-size:12px; color:#8a5a1a;}
  .error{color:#c62828; font-size:13px; margin-top:6px;}
  .hidden{display:none !important;}
  .header{background:var(--orange); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5;}
  .header h2{margin:0; font-size:18px;}
  .search{padding:10px 16px;}
  .search input{background:#fff;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 90px;}
  .pcard{background:#fff; border-radius:14px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); position:relative;}
  .pcard .tag{position:absolute; top:8px; left:8px; background:#fff3e0; color:var(--orange-dark); font-size:10px; padding:2px 6px; border-radius:6px; font-weight:700;}
  .pcard img{width:100%; height:90px; object-fit:contain; margin:18px 0 6px;}
  .pcard .name{font-weight:700; font-size:14px; margin-bottom:2px;}
  .pcard .price{color:var(--orange-dark); font-weight:700;}
  .pcard .unit{font-size:11px; color:#888;}
  .pcard button{width:100%; background:#2e2e2e; color:#fff; border:none; padding:8px; border-radius:8px; font-size:12px; margin-top:8px; cursor:pointer;}
  .bottomnav{position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; box-shadow:0 -2px 10px rgba(0,0,0,.08); max-width:480px; margin:0 auto;}
  .navitem{flex:1; text-align:center; padding:10px 0; font-size:11px; color:#888; cursor:pointer;}
  .navitem.active{color:var(--orange);}
  .navitem .ic{font-size:20px; display:block;}
  .list-item{background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .badge{font-size:11px; padding:3px 8px; border-radius:20px; font-weight:700;}
  .badge.pending{background:#fff3e0;color:#e65100;}
  .badge.confirmed{background:#e3f2fd;color:#1565c0;}
  .badge.delivered{background:#e8f5e9;color:#2e7d32;}
  .badge.cancelled{background:#ffebee;color:#c62828;}
  .badge.open{background:#ffebee;color:#c62828;}
  .badge.resolved{background:#e8f5e9;color:#2e7d32;}
  .btn-sm{padding:6px 10px; border-radius:8px; border:none; font-size:12px; margin-left:6px; cursor:pointer;}
  .btn-call{background:#43a047; color:#fff;}
  .btn-complain{background:#f44336; color:#fff;}
  .btn-mini{background:#eee; color:#333;}
  .fab{position:fixed; bottom:70px; right:20px; background:var(--orange); color:#fff; width:54px; height:54px; border-radius:50%; border:none; font-size:26px; box-shadow:0 4px 12px rgba(0,0,0,.3); cursor:pointer;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; z-index:50;}
  .modal{background:#fff; width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
  .modal h3{margin-top:0;}
  .close-x{float:right; cursor:pointer; font-size:20px; color:#888;}
  .admintabs{display:flex; overflow-x:auto; gap:8px; padding:10px 16px; background:#fff;}
  .admintabs .t{flex:0 0 auto; padding:8px 14px; border-radius:20px; background:#f1f1f1; font-size:13px; font-weight:600; color:#555; cursor:pointer;}
  .admintabs .t.active{background:var(--orange); color:#fff;}
  .section{padding:14px 16px 100px;}
  .small{font-size:12px; color:#777;}
  .imgpick{border:2px dashed #ddd; border-radius:12px; padding:16px; text-align:center; color:#999; cursor:pointer; margin-top:6px;}
  .imgpick img{max-width:100%; max-height:120px;}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ======================= FIREBASE CONFIG =======================
   এখানে তোমার নিজের Firebase প্রজেক্টের config বসাবে (নিচের চ্যাট মেসেজে
   step-by-step দেখানো হয়েছে কোথা থেকে এটা পাবে)।                       */
const firebaseConfig = {
  apiKey: "AIzaSyCy2ZSF1-bPUWW0Tsw71_PocJJa7NZyW_s",
  authDomain: "supplybazar.firebaseapp.com",
  projectId: "supplybazar",
  storageBucket: "supplybazar.firebasestorage.app",
  messagingSenderId: "943373025658",
  appId: "1:943373025658:web:ebef6783ac88d4b9a016c3",
  measurementId: "G-GF93JK7SW8"
};
/* ছবি আপলোডের জন্য ImgBB ফ্রি এপিআই কী (নিচে ধাপে ধাপে বলা আছে কিভাবে নিবে) */
const IMGBB_API_KEY = "c2fd961aec9afd1dc01e00d7d7549e22";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null; // {uid, role, name, phone, shopOrCompany, banned}
let cart = {}; // productId -> {product, qty}
let allProducts = [];
let adminTab = 'users';

const app = document.getElementById('app');

function fakeEmail(phone){ return phone.trim() + "@supplybazar.app"; }

/* ======================= ROUTER ======================= */
function render(){
  const isAdminUrl = location.search.includes('admin=1');
  if(!currentUser){
    if(isAdminUrl) return renderAdminLogin();
    return renderLanding();
  }
  if(currentUser.banned) return renderBanned();
  if(currentUser.role === 'shopkeeper') return renderShopkeeperDashboard();
  if(currentUser.role === 'sr') return renderSRDashboard();
  if(currentUser.role === 'admin') return renderAdminDashboard();
}

/* ======================= LANDING (SIGNUP/LOGIN) ======================= */
let landingRole = 'shopkeeper';
let landingMode = 'signup';
let logoTaps = 0;

function renderLanding(){
  const isSignup = landingMode === 'signup';
  app.innerHTML = `
    <div class="topbar">
      <h1 onclick="tapLogo()">সাপ্লাই বাজার</h1>
    </div>
    <div class="container">
      <div style="text-align:center;color:#fff;margin-bottom:14px;">
        <div style="font-size:22px;font-weight:800;">সাপ্লাই বাজার</div>
        <div style="font-size:13px;opacity:.9;">দোকানদার ও SR — একসাথে, সহজে</div>
      </div>
      <div class="card">
        <div class="tabs">
          <div class="tab ${landingRole==='shopkeeper'?'active':''}" onclick="setLandingRole('shopkeeper')">🏪 দোকানদার</div>
          <div class="tab ${landingRole==='sr'?'active':''}" onclick="setLandingRole('sr')">🧑‍💼 SR</div>
        </div>
        ${isSignup ? `
          <label>আপনার নাম</label>
          <input id="f_name" placeholder="যেমনঃ রহিম উদ্দিন">
          <label>${landingRole==='sr'?'কোম্পানির নাম':'দোকানের নাম'}</label>
          <input id="f_org" placeholder="${landingRole==='sr'?'যেমনঃ প্রাণ গ্রুপ':'যেমনঃ আলম জেনারেল স্টোর'}">
        `:``}
        <label>মোবাইল নাম্বার</label>
        <input id="f_phone" placeholder="017XXXXXXXX">
        <label>পাসওয়ার্ড</label>
        <input id="f_pass" type="password" placeholder="${isSignup?'একটি পাসওয়ার্ড দিন':'পাসওয়ার্ড দিন'}">
        <div id="f_err" class="error"></div>
        <button class="primary" onclick="${isSignup?'doSignup()':'doLogin()'}">${isSignup?'একাউন্ট তৈরি করুন':'লগইন করুন'}</button>
        <a class="link" onclick="toggleMode()">${isSignup?'আগে থেকে একাউন্ট আছে? লগইন করুন':'নতুন একাউন্ট খুলুন'}</a>
        ${!isSignup?`<div class="hint">ডেমো একাউন্ট — দোকানদারঃ 01911111111 / 1234<br>SR (প্রাণ)ঃ 01711111111 / 1234</div>`:``}
      </div>
    </div>
  `;
}
function tapLogo(){ logoTaps++; if(logoTaps>=5){ location.search='?admin=1'; } }
function setLandingRole(r){ landingRole=r; renderLanding(); }
function toggleMode(){ landingMode = landingMode==='signup'?'login':'signup'; renderLanding(); }

async function doSignup(){
  const name=document.getElementById('f_name').value.trim();
  const org=document.getElementById('f_org').value.trim();
  const phone=document.getElementById('f_phone').value.trim();
  const pass=document.getElementById('f_pass').value;
  const errEl=document.getElementById('f_err');
  if(!name||!org||!phone||!pass){ errEl.textContent='সব ঘর পূরণ করুন'; return; }
  try{
    const cred = await auth.createUserWithEmailAndPassword(fakeEmail(phone), pass);
    await db.collection('users').doc(cred.user.uid).set({
      role: landingRole, name, org, phone, banned:false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ errEl.textContent = friendlyError(e); }
}
async function doLogin(){
  const phone=document.getElementById('f_phone').value.trim();
  const pass=document.getElementById('f_pass').value;
  const errEl=document.getElementById('f_err');
  try{
    await auth.signInWithEmailAndPassword(fakeEmail(phone), pass);
  }catch(e){ errEl.textContent = friendlyError(e); }
}
function friendlyError(e){
  if(e.code==='auth/email-already-in-use') return 'এই নাম্বারে আগে থেকে একাউন্ট আছে';
  if(e.code==='auth/wrong-password' || e.code==='auth/invalid-credential') return 'নাম্বার বা পাসওয়ার্ড ভুল';
  if(e.code==='auth/user-not-found') return 'একাউন্ট পাওয়া যায়নি';
  if(e.code==='auth/weak-password') return 'পাসওয়ার্ড কমপক্ষে ৬ ডিজিট দিন';
  return e.message;
}
function renderBanned(){
  app.innerHTML = `<div class="container"><div class="card" style="text-align:center;margin-top:60px;">
    <h3>🚫 আপনার একাউন্টটি সাময়িকভাবে বন্ধ করা হয়েছে</h3>
    <p class="small">বিস্তারিত জানতে অ্যাডমিনের সাথে যোগাযোগ করুন।</p>
    <button class="secondary" onclick="doLogout()">লগ আউট</button>
  </div></div>`;
}
function doLogout(){ auth.signOut(); }

/* ======================= SHOPKEEPER DASHBOARD ======================= */
let shopTab='home';
function renderShopkeeperDashboard(){
  if(shopTab==='home') return renderShopHome();
  if(shopTab==='cart') return renderShopCart();
  if(shopTab==='orders') return renderShopOrders();
  if(shopTab==='profile') return renderProfile();
}
function bottomNav(active, tabs){
  return `<div class="bottomnav">${tabs.map(t=>`
    <div class="navitem ${active===t.key?'active':''}" onclick="${t.action}">
      <span class="ic">${t.icon}</span>${t.label}
    </div>`).join('')}</div>`;
}
function renderShopHome(){
  app.innerHTML = `
    <div class="header"><h2>🛒 সাপ্লাই বাজার</h2><span>${Object.keys(cart).length?'🛍️'+Object.values(cart).reduce((a,c)=>a+c.qty,0):''}</span></div>
    <div class="search"><input placeholder="প্রোডাক্ট বা কোম্পানি খুঁজুন..." oninput="filterProducts(this.value)"></div>
    <div class="grid" id="prodGrid">লোড হচ্ছে...</div>
    ${bottomNav('home',[
      {key:'home',icon:'🏠',label:'হোম',action:"setShopTab('home')"},
      {key:'cart',icon:'🛍️',label:'কার্ট',action:"setShopTab('cart')"},
      {key:'orders',icon:'📋',label:'অর্ডার',action:"setShopTab('orders')"},
      {key:'profile',icon:'👤',label:'প্রোফাইল',action:"setShopTab('profile')"}])}
  `;
  loadProducts();
}
function setShopTab(t){ shopTab=t; render(); }
async function loadProducts(){
  db.collection('products').where('active','==',true).onSnapshot(snap=>{
    allProducts = snap.docs.map(d=>({id:d.id,...d.data()}));
    filterProducts(document.querySelector('.search input')?.value||'');
  });
}
function filterProducts(q){
  const grid = document.getElementById('prodGrid');
  if(!grid) return;
  const list = allProducts.filter(p=> !q || p.name.includes(q) || (p.company||'').includes(q));
  grid.innerHTML = list.map(p=>`
    <div class="pcard">
      ${p.company?`<div class="tag">${p.company}</div>`:''}
      <img src="${p.imageUrl||'https://via.placeholder.com/100?text=📦'}">
      <div class="name">${p.name}</div>
      <div class="price">৳${p.price} <span class="unit">/ ${p.unit}</span></div>
      <div class="small">SR: ${p.srName} (${p.srPhone})</div>
      <button onclick="addToCart('${p.id}')">🛍️ কার্টে যোগ করুন</button>
    </div>
  `).join('') || '<div style="grid-column:span 2;text-align:center;color:#999;">কোনো প্রোডাক্ট নেই</div>';
}
function addToCart(id){
  const p = allProducts.find(x=>x.id===id);
  if(!cart[id]) cart[id] = {product:p, qty:1}; else cart[id].qty++;
  alert('কার্টে যোগ হয়েছে ✅');
}
function renderShopCart(){
  const items = Object.values(cart);
  const total = items.reduce((s,c)=>s+c.qty*c.product.price,0);
  app.innerHTML = `
    <div class="header"><h2>🛍️ আমার কার্ট</h2></div>
    <div class="section">
      ${items.length? items.map(c=>`
        <div class="list-item row">
          <div>
            <b>${c.product.name}</b><br>
            <span class="small">৳${c.product.price} × 
              <input type="number" min="1" value="${c.qty}" style="width:50px;display:inline-block;padding:4px;" onchange="updateQty('${c.product.id}', this.value)">
            </span>
          </div>
          <div>৳${c.qty*c.product.price}</div>
        </div>`).join('') : '<p class="small" style="text-align:center;">কার্ট খালি</p>'}
      ${items.length?`
        <div class="list-item row"><b>মোট</b><b>৳${total}</b></div>
        <button class="primary" onclick="placeOrder()">✅ অর্ডার কনফার্ম করুন</button>
      `:''}
    </div>
    ${bottomNav('cart',[
      {key:'home',icon:'🏠',label:'হোম',action:"setShopTab('home')"},
      {key:'cart',icon:'🛍️',label:'কার্ট',action:"setShopTab('cart')"},
      {key:'orders',icon:'📋',label:'অর্ডার',action:"setShopTab('orders')"},
      {key:'profile',icon:'👤',label:'প্রোফাইল',action:"setShopTab('profile')"}])}
  `;
}
function updateQty(id, val){ cart[id].qty = Math.max(1, parseInt(val)||1); renderShopCart(); }
async function placeOrder(){
  const items = Object.values(cart);
  if(!items.length) return;
  const bySR = {};
  items.forEach(c=>{ const sid=c.product.srId; if(!bySR[sid]) bySR[sid]=[]; bySR[sid].push(c); });
  for(const srId in bySR){
    const list = bySR[srId];
    const total = list.reduce((s,c)=>s+c.qty*c.product.price,0);
    await db.collection('orders').add({
      shopkeeperId: currentUser.uid, shopkeeperName: currentUser.name, shopkeeperPhone: currentUser.phone,
      srId, srName: list[0].product.srName, srPhone: list[0].product.srPhone,
      items: list.map(c=>({productId:c.product.id, name:c.product.name, qty:c.qty, price:c.product.price})),
      total, status:'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
  cart = {};
  alert('অর্ডার সম্পন্ন হয়েছে! SR শীঘ্রই আপনাকে কল করবে।');
  setShopTab('orders');
}
function renderShopOrders(){
  app.innerHTML = `<div class="header"><h2>📋 আমার অর্ডার</h2></div><div class="section" id="ordList">লোড হচ্ছে...</div>${bottomNav('orders',[
    {key:'home',icon:'🏠',label:'হোম',action:"setShopTab('home')"},
    {key:'cart',icon:'🛍️',label:'কার্ট',action:"setShopTab('cart')"},
    {key:'orders',icon:'📋',label:'অর্ডার',action:"setShopTab('orders')"},
    {key:'profile',icon:'👤',label:'প্রোফাইল',action:"setShopTab('profile')"}])}`;
  db.collection('orders').where('shopkeeperId','==',currentUser.uid).onSnapshot(snap=>{
    const el = document.getElementById('ordList'); if(!el) return;
    const docs = snap.docs.slice().sort((a,b)=>{
      const ta=a.data().createdAt?.toMillis?.()||0, tb=b.data().createdAt?.toMillis?.()||0;
      return tb-ta;
    });
    el.innerHTML = docs.map(d=>{ const o={id:d.id,...d.data()};
      return `<div class="list-item">
        <div class="row"><b>${o.srName}</b><span class="badge ${o.status}">${statusBn(o.status)}</span></div>
        <div class="small">মোট: ৳${o.total} • ${o.items.length} আইটেম</div>
        <div style="margin-top:8px;">
          <button class="btn-sm btn-call" onclick="location.href='tel:${o.srPhone}'">📞 SR কে কল করুন</button>
          <button class="btn-sm btn-complain" onclick="openComplaint('${o.srId}','${o.srName}','${o.srPhone}','sr','${o.id}')">⚠️ অভিযোগ</button>
        </div>
      </div>`;
    }).join('') || '<p class="small" style="text-align:center;">কোনো অর্ডার নেই</p>';
  });
}
function statusBn(s){ return {pending:'অপেক্ষমান',confirmed:'কনফার্ম',delivered:'ডেলিভারি হয়েছে',cancelled:'বাতিল'}[s]||s; }

/* ======================= COMPLAINT MODAL (shared) ======================= */
function openComplaint(againstId, againstName, againstPhone, againstRole, orderId){
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `<div class="modal">
    <span class="close-x" onclick="this.closest('.modal-bg').remove()">✕</span>
    <h3>⚠️ অভিযোগ জানান</h3>
    <p class="small">${againstName} (${againstPhone}) এর বিরুদ্ধে</p>
    <label>বিস্তারিত লিখুন</label>
    <textarea id="cplText" rows="4" placeholder="সমস্যাটি লিখুন..."></textarea>
    <button class="primary" onclick="submitComplaint('${againstId}','${againstName}','${againstPhone}','${againstRole}','${orderId||''}')">জমা দিন</button>
  </div>`;
  document.body.appendChild(bg);
}
async function submitComplaint(againstId, againstName, againstPhone, againstRole, orderId){
  const text = document.getElementById('cplText').value.trim();
  if(!text) return alert('বিস্তারিত লিখুন');
  await db.collection('complaints').add({
    fromId: currentUser.uid, fromName: currentUser.name, fromPhone: currentUser.phone, fromRole: currentUser.role,
    againstId, againstName, againstPhone, againstRole,
    orderId: orderId||null, message:text, status:'open', adminNote:'',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.querySelector('.modal-bg').remove();
  alert('অভিযোগ জমা হয়েছে, অ্যাডমিন শীঘ্রই দেখবেন');
}

function renderProfile(){
  app.innerHTML = `<div class="header"><h2>👤 প্রোফাইল</h2></div>
    <div class="section">
      <div class="list-item">
        <div><b>${currentUser.name}</b></div>
        <div class="small">${currentUser.org}</div>
        <div class="small">📱 ${currentUser.phone}</div>
        <div class="small">ভূমিকা: ${currentUser.role==='shopkeeper'?'দোকানদার':currentUser.role==='sr'?'SR':'অ্যাডমিন'}</div>
      </div>
      <button class="secondary" onclick="doLogout()">🚪 লগ আউট</button>

    ${currentUser.role==='shopkeeper'?bottomNav('profile',[

      {key:'cart',icon:'🛍️',label:'কার্ট',action:"setShopTab('cart')"},
      {key:'orders',icon:'📋',label:'অর্ডার',action:"setShopTab('orders')"},
      {key:'profile',icon:'👤',label:'প্রোফাইল',action:"setShopTab('profile')"}]): ''}
  `;
}

/* ======================= SR DASHBOARD ======================= */
let srTab='products';
function renderSRDashboard(){
  app.innerHTML = `<div class="header"><h2>🧑‍💼 SR ড্যাশবোর্ড</h2></div>
    <div class="admintabs">
      <div class="t ${srTab==='products'?'active':''}" onclick="setSRTab('products')">📦 আমার প্রোডাক্ট</div>
      <div class="t ${srTab==='orders'?'active':''}" onclick="setSRTab('orders')">📋 অর্ডার</div>
      <div class="t ${srTab==='complaints'?'active':''}" onclick="setSRTab('complaints')">⚠️ অভিযোগ</div>
      <div class="t ${srTab==='profile'?'active':''}" onclick="setSRTab('profile')">👤 প্রোফাইল</div>
    </div>
    <div class="section" id="srBody"></div>
    <button class="fab" onclick="openAddProduct()" style="${srTab!=='products'?'display:none':''}">+</button>
  `;
  loadSRTab();
}
function setSRTab(t){ srTab=t; renderSRDashboard(); }
function loadSRTab(){
  if(srTab==='products') return loadSRProducts();
  if(srTab==='orders') return loadSROrders();
  if(srTab==='complaints') return loadSRComplaints();
  if(srTab==='profile') { document.getElementById('srBody').innerHTML = profileHtml(); }
}
function profileHtml(){
  return `<div class="list-item"><b>${currentUser.name}</b><div class="small">${currentUser.org}</div>
    <div class="small">📱 ${currentUser.phone}</div></div>
    <button class="secondary" onclick="doLogout()">🚪 লগ আউট</button>`;
}
function loadSRProducts(){
  db.collection('products').where('srId','==',currentUser.uid).onSnapshot(snap=>{
    const el=document.getElementById('srBody'); if(!el) return;
    el.innerHTML = snap.docs.map(d=>{ const p={id:d.id,...d.data()};
      return `<div class="list-item row">
        <div><img src="${p.imageUrl||'https://via.placeholder.com/50'}" style="width:40px;height:40px;object-fit:contain;vertical-align:middle;margin-right:8px;"><b>${p.name}</b><div class="small">৳${p.price}/${p.unit}</div></div>
        <button class="btn-sm btn-mini" onclick="toggleProductActive('${p.id}',${!p.active})">${p.active?'বন্ধ করুন':'চালু করুন'}</button>
      </div>`;
    }).join('') || '<p class="small" style="text-align:center;">এখনো কোনো প্রোডাক্ট যোগ করেননি। নিচের + বাটনে চাপুন।</p>';
  });
}
async function toggleProductActive(id, val){ await db.collection('products').doc(id).update({active:val}); }
function openAddProduct(){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <span class="close-x" onclick="this.closest('.modal-bg').remove()">✕</span>
    <h3>➕ নতুন প্রোডাক্ট</h3>
    <label>প্রোডাক্টের নাম</label><input id="p_name">
    <label>কোম্পানির নাম</label><input id="p_company" value="${currentUser.org}">
    <label>দাম (৳)</label><input id="p_price" type="number">
    <label>একক (যেমনঃ প্যাকেট/পিস)</label><input id="p_unit" value="প্যাকেট">
    <label>ছবি</label>
    <div class="imgpick" onclick="document.getElementById('p_img').click()" id="imgPreview">📷 ছবি বাছাই করুন</div>
    <input type="file" id="p_img" accept="image/*" class="hidden" onchange="previewImg(this)">
    <button class="primary" onclick="saveProduct()">সংরক্ষণ করুন</button>
  </div>`;
  document.body.appendChild(bg);
}
function previewImg(input){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{ document.getElementById('imgPreview').innerHTML=`<img src="${e.target.result}">`; };
  reader.readAsDataURL(f);
}
async function saveProduct(forSrId, forSrName, forSrPhone, forSrOrg){
  const name=document.getElementById('p_name').value.trim();
  const company=document.getElementById('p_company').value.trim();
  const price=parseFloat(document.getElementById('p_price').value);
  const unit=document.getElementById('p_unit').value.trim();
  const file=document.getElementById('p_img').files[0];
  if(!name||!price){ alert('নাম ও দাম দিন'); return; }
  let imageUrl='';
  if(file){
    imageUrl = await uploadToImgBB(file);
  }
  const srId = forSrId || currentUser.uid;
  const srName = forSrName || currentUser.name;
  const srPhone = forSrPhone || currentUser.phone;
  await db.collection('products').add({
    name, company, price, unit, imageUrl, srId, srName, srPhone, active:true,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.querySelector('.modal-bg').remove();
  alert('প্রোডাক্ট যোগ হয়েছে ✅');
}
async function uploadToImgBB(file){
  const fd = new FormData(); fd.append('image', file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {method:'POST', body:fd});
  const json = await res.json();
  return json?.data?.url || '';
}
function loadSROrders(){
  db.collection('orders').where('srId','==',currentUser.uid).onSnapshot(snap=>{
    const el=document.getElementById('srBody'); if(!el) return;
    const docs = snap.docs.slice().sort((a,b)=>{
      const ta=a.data().createdAt?.toMillis?.()||0, tb=b.data().createdAt?.toMillis?.()||0;
      return tb-ta;
    });
    el.innerHTML = docs.map(d=>{ const o={id:d.id,...d.data()};
      return `<div class="list-item">
        <div class="row"><b>${o.shopkeeperName}</b><span class="badge ${o.status}">${statusBn(o.status)}</span></div>
        <div class="small">মোট: ৳${o.total}</div>
        <div style="margin-top:8px;">
          <button class="btn-sm btn-call" onclick="location.href='tel:${o.shopkeeperPhone}'">📞 কল করুন</button>
          <select onchange="updateOrderStatus('${o.id}', this.value)" class="btn-sm btn-mini" style="border:none;">
            <option value="">স্ট্যাটাস বদলান</option>
            <option value="confirmed">কনফার্ম</option>
            <option value="delivered">ডেলিভারি হয়েছে</option>
            <option value="cancelled">বাতিল</option>
          </select>
          <button class="btn-sm btn-complain" onclick="openComplaint('${o.shopkeeperId}','${o.shopkeeperName}','${o.shopkeeperPhone}','shopkeeper','${o.id}')">⚠️ অভিযোগ</button>
        </div>
      </div>`;
    }).join('') || '<p class="small" style="text-align:center;">কোনো অর্ডার নেই</p>';
  });
}
async function updateOrderStatus(id, status){ if(!status) return; await db.collection('orders').doc(id).update({status}); }
function loadSRComplaints(){
  db.collection('complaints').where('fromId','==',currentUser.uid).onSnapshot(snap=>{
    const el=document.getElementById('srBody'); if(!el) return;
    const docs = snap.docs.slice().sort((a,b)=>{
      const ta=a.data().createdAt?.toMillis?.()||0, tb=b.data().createdAt?.toMillis?.()||0;
      return tb-ta;
    });
    el.innerHTML = docs.map(d=>{ const c={id:d.id,...d.data()};
      return `<div class="list-item"><div class="row"><b>${c.againstName}</b><span class="badge ${c.status}">${c.status==='open'?'পেন্ডিং':'সমাধান হয়েছে'}</span></div>
      <div class="small">${c.message}</div>${c.adminNote?`<div class="small" style="color:#2e7d32;">অ্যাডমিন: ${c.adminNote}</div>`:''}</div>`;
    }).join('') || '<p class="small" style="text-align:center;">কোনো অভিযোগ নেই</p>';
  });
}

/* ======================= ADMIN LOGIN ======================= */
function renderAdminLogin(){
  app.innerHTML = `<div class="container" style="margin-top:60px;">
    <div class="card">
      <h3 style="text-align:center;">🔐 অ্যাডমিন লগইন</h3>
      <label>মোবাইল নাম্বার</label><input id="a_phone">
      <label>পাসওয়ার্ড</label><input id="a_pass" type="password">
      <div id="a_err" class="error"></div>
      <button class="primary" onclick="doAdminLogin()">লগইন করুন</button>
    </div></div>`;
}
async function doAdminLogin(){
  const phone=document.getElementById('a_phone').value.trim();
  const pass=document.getElementById('a_pass').value;
  try{ await auth.signInWithEmailAndPassword(fakeEmail(phone), pass); }
  catch(e){ document.getElementById('a_err').textContent = friendlyError(e); }
}

/* ======================= ADMIN DASHBOARD ======================= */
function renderAdminDashboard(){
  app.innerHTML = `<div class="header"><h2>🛠️ অ্যাডমিন প্যানেল</h2></div>
    <div class="admintabs">
      <div class="t ${adminTab==='users'?'active':''}" onclick="setAdminTab('users')">👥 ইউজার</div>
      <div class="t ${adminTab==='products'?'active':''}" onclick="setAdminTab('products')">📦 প্রোডাক্ট</div>
      <div class="t ${adminTab==='orders'?'active':''}" onclick="setAdminTab('orders')">📋 অর্ডার</div>
      <div class="t ${adminTab==='complaints'?'active':''}" onclick="setAdminTab('complaints')">⚠️ অভিযোগ</div>
      <div class="t" onclick="doLogout()">🚪 লগআউট</div>
    </div>
    <div class="section" id="adminBody"></div>`;
  loadAdminTab();
}
function setAdminTab(t){ adminTab=t; renderAdminDashboard(); }
function loadAdminTab(){
  if(adminTab==='users') return loadAdminUsers();
  if(adminTab==='products') return loadAdminProducts();
  if(adminTab==='orders') return loadAdminOrders();
  if(adminTab==='complaints') return loadAdminComplaints();
}
function loadAdminUsers(){
  db.collection('users').onSnapshot(snap=>{
    const el=document.getElementById('adminBody'); if(!el) return;
    el.innerHTML = snap.docs.map(d=>{ const u={id:d.id,...d.data()};
      if(u.role==='admin') return '';
      return `<div class="list-item">
        <div class="row"><b>${u.name}</b><span class="small">${u.role==='shopkeeper'?'দোকানদার':'SR'}</span></div>
        <div class="small">${u.org} • 📱${u.phone}</div>
        <div style="margin-top:8px;">
          <button class="btn-sm btn-mini" onclick="viewUserProfile('${u.id}')">🔍 প্রোফাইল দেখুন</button>
          <button class="btn-sm ${u.banned?'':'btn-complain'}" onclick="toggleBan('${u.id}',${!u.banned})">${u.banned?'আনব্যান করুন':'ব্যান করুন'}</button>
        </div>
      </div>`;
    }).join('');
  });
}
async function toggleBan(uid, val){ await db.collection('users').doc(uid).update({banned:val}); }
async function viewUserProfile(uid){
  const udoc = await db.collection('users').doc(uid).get();
  const u = udoc.data();
  const prodSnap = await db.collection('products').where('srId','==',uid).get();
  const orderSnap1 = await db.collection('orders').where('srId','==',uid).get();
  const orderSnap2 = await db.collection('orders').where('shopkeeperId','==',uid).get();
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <span class="close-x" onclick="this.closest('.modal-bg').remove()">✕</span>
    <h3>${u.name}</h3>
    <p class="small">${u.org} • 📱 ${u.phone} • ${u.role==='sr'?'SR':'দোকানদার'}</p>
    ${u.role==='sr'?`<b>প্রোডাক্ট (${prodSnap.size})</b>${prodSnap.docs.map(d=>`<div class="small">• ${d.data().name} — ৳${d.data().price}</div>`).join('')}`:''}
    <b style="display:block;margin-top:10px;">অর্ডার (${orderSnap1.size+orderSnap2.size})</b>
    ${[...orderSnap1.docs,...orderSnap2.docs].map(d=>`<div class="small">• ৳${d.data().total} — ${statusBn(d.data().status)}</div>`).join('')||'<div class="small">নেই</div>'}
    ${u.role==='sr'?`<button class="secondary" style="margin-top:14px;" onclick="this.closest('.modal-bg').remove(); openAddProduct(); presetSR('${uid}','${u.name}','${u.phone}','${u.org}');">➕ এই SR এর হয়ে প্রোডাক্ট যোগ করুন</button>`:''}
  </div>`;
  document.body.appendChild(bg);
}
function presetSR(id,name,phone,org){
  setTimeout(()=>{
    const btn = document.querySelector('.modal .primary');
    if(btn) btn.setAttribute('onclick', `saveProduct('${id}','${name}','${phone}','${org}')`);
  },50);
}
function loadAdminProducts(){
  db.collection('products').onSnapshot(snap=>{
    const el=document.getElementById('adminBody'); if(!el) return;
    el.innerHTML = `<button class="secondary" onclick="openAdminAddProductPicker()">➕ যেকোনো SR এর হয়ে প্রোডাক্ট যোগ করুন</button>` +
    snap.docs.map(d=>{ const p={id:d.id,...d.data()};
      return `<div class="list-item row"><div><b>${p.name}</b><div class="small">SR: ${p.srName} • ৳${p.price}/${p.unit}</div></div>
      <button class="btn-sm btn-mini" onclick="toggleProductActive('${p.id}',${!p.active})">${p.active?'বন্ধ':'চালু'}</button></div>`;
    }).join('');
  });
}
async function openAdminAddProductPicker(){
  const snap = await db.collection('users').where('role','==','sr').get();
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><span class="close-x" onclick="this.closest('.modal-bg').remove()">✕</span>
  <h3>SR বাছাই করুন</h3>
  ${snap.docs.map(d=>{ const u=d.data();
    return `<div class="list-item" onclick="this.closest('.modal-bg').remove(); openAddProduct(); presetSR('${d.id}','${u.name}','${u.phone}','${u.org}');">${u.name} — ${u.org}</div>`;
  }).join('')}
  </div>`;
  document.body.appendChild(bg);
}
function loadAdminOrders(){
  db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap=>{
    const el=document.getElementById('adminBody'); if(!el) return;
    el.innerHTML = `<button class="secondary" onclick="createTestOrder()">🧪 টেস্ট (ফেক) অর্ডার তৈরি করুন</button>` +
    snap.docs.map(d=>{ const o={id:d.id,...d.data()};
      return `<div class="list-item"><div class="row"><b>${o.shopkeeperName} → ${o.srName}</b><span class="badge ${o.status}">${statusBn(o.status)}</span></div>
      <div class="small">৳${o.total} ${o.isTest?'(টেস্ট অর্ডার)':''}</div></div>`;
    }).join('');
  });
}
async function createTestOrder(){
  const srSnap = await db.collection('users').where('role','==','sr').limit(1).get();
  const skSnap = await db.collection('users').where('role','==','shopkeeper').limit(1).get();
  if(srSnap.empty || skSnap.empty){ alert('টেস্টের জন্য অন্তত একজন SR ও একজন দোকানদার একাউন্ট থাকতে হবে'); return; }
  const sr=srSnap.docs[0].data(), sk=skSnap.docs[0].data();
  await db.collection('orders').add({
    shopkeeperId: skSnap.docs[0].id, shopkeeperName: sk.name, shopkeeperPhone: sk.phone,
    srId: srSnap.docs[0].id, srName: sr.name, srPhone: sr.phone,
    items:[{productId:'test', name:'টেস্ট প্রোডাক্ট', qty:1, price:10}], total:10, status:'pending', isTest:true,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  alert('টেস্ট অর্ডার তৈরি হয়েছে ✅');
}
function loadAdminComplaints(){
  db.collection('complaints').orderBy('createdAt','desc').onSnapshot(snap=>{
    const el=document.getElementById('adminBody'); if(!el) return;
    el.innerHTML = snap.docs.map(d=>{ const c={id:d.id,...d.data()};
      return `<div class="list-item">
        <div class="row"><b>${c.fromName} → ${c.againstName}</b><span class="badge ${c.status}">${c.status==='open'?'পেন্ডিং':'সমাধান'}</span></div>
        <div class="small">${c.message}</div>
        <div class="small">📱 অভিযোগকারী: ${c.fromPhone} • অভিযুক্ত: ${c.againstPhone}</div>
        ${c.status==='open'?`
          <textarea id="note_${c.id}" placeholder="অ্যাডমিন নোট..." rows="2" style="margin-top:6px;"></textarea>
          <button class="btn-sm btn-mini" style="margin-top:6px;" onclick="resolveComplaint('${c.id}')">✅ সমাধান হিসেবে চিহ্নিত করুন</button>
          <button class="btn-sm btn-complain" onclick="toggleBan('${c.againstId}',true)">🚫 অভিযুক্তকে ব্যান করুন</button>
        `:`<div class="small" style="color:#2e7d32;">নোট: ${c.adminNote}</div>`}
      </div>`;
    }).join('') || '<p class="small">কোনো অভিযোগ নেই</p>';
  });
}
async function resolveComplaint(id){
  const note = document.getElementById('note_'+id).value.trim();
  await db.collection('complaints').doc(id).update({status:'resolved', adminNote:note});
}

/* ======================= AUTH STATE LISTENER ======================= */
auth.onAuthStateChanged(async (user)=>{
  if(!user){ currentUser=null; render(); return; }
  const doc = await db.collection('users').doc(user.uid).get();
  if(!doc.exists){ currentUser=null; render(); return; }
  currentUser = {uid:user.uid, ...doc.data()};
  render();
});
render();
</script>
</body>
</html>
